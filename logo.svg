  <path d="M2.7 10.3 A4.7 4.7 0 0 1 2.7 19.7 Z" fill="#0f6b5c"/>
  <path d="M0 12.5 A2.5 2.5 0 0 1 0 17.5 Z" fill="#0a3d34"/>
</svg>
